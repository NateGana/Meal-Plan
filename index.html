<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MealPlan - Meal & Grocery Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M17 2a5 5 0 0 0-5 5v3a2 2 0 0 0 2 2h1v10"/></svg>
      <span>MealPlan</span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-section="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-section="planner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Weekly Planner
      </button>
      <button class="nav-item" data-section="grocery">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Grocery List
      </button>
    </nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- Main content -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 id="page-title">Dashboard</h1>
      <button class="btn btn-primary" id="header-add-btn">+ Add Meal</button>
    </header>

    <main class="content">

      <!-- DASHBOARD -->
      <section class="section active" id="section-dashboard">
        <div class="stats-grid">
          <div class="stat-card"><span class="stat-label">Planned Meals</span><span class="stat-value" id="stat-planned">0</span></div>
          <div class="stat-card"><span class="stat-label">Meals This Week</span><span class="stat-value" id="stat-week">0</span></div>
          <div class="stat-card"><span class="stat-label">Grocery Items</span><span class="stat-value" id="stat-grocery">0</span></div>
          <div class="stat-card"><span class="stat-label">Purchased Items</span><span class="stat-value" id="stat-purchased">0</span></div>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <div class="card-header"><h2>Today's Meals</h2></div>
            <div id="today-meals" class="today-meals"></div>
          </div>

          <div class="card">
            <div class="card-header"><h2>Grocery Progress</h2></div>
            <div id="grocery-progress-text" class="progress-text">0 / 0 items purchased</div>
            <div class="progress-bar-track">
              <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- WEEKLY PLANNER -->
      <section class="section" id="section-planner">
        <div class="toolbar">
          <input type="text" id="meal-search" class="search-input" placeholder="Search meals...">
          <select id="meal-type-filter" class="filter-select">
            <option value="all">All Types</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
            <option value="Snack">Snack</option>
          </select>
        </div>
        <div class="week-grid" id="week-grid"></div>
      </section>

      <!-- GROCERY LIST -->
      <section class="section" id="section-grocery">
        <div class="card">
          <div class="card-header">
            <h2>Grocery List</h2>
            <button class="btn btn-primary btn-sm" id="open-grocery-modal">+ Add Item</button>
          </div>
          <div class="toolbar">
            <input type="text" id="grocery-search" class="search-input" placeholder="Search grocery items...">
            <select id="grocery-category-filter" class="filter-select">
              <option value="all">All Categories</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Fruits">Fruits</option>
              <option value="Meat">Meat</option>
              <option value="Dairy">Dairy</option>
              <option value="Grains">Grains</option>
              <option value="Drinks">Drinks</option>
              <option value="Snacks">Snacks</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div id="grocery-list" class="grocery-list"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- Meal Modal -->
<div class="modal-overlay" id="meal-modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="meal-modal-title">Add Meal</h3>
      <button class="modal-close" id="close-meal-modal">&times;</button>
    </div>
    <form id="meal-form">
      <input type="hidden" id="meal-id">
      <div class="form-row">
        <div class="form-group">
          <label for="meal-day">Day</label>
          <select id="meal-day" required>
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </div>
        <div class="form-group">
          <label for="meal-type">Meal Type</label>
          <select id="meal-type" required>
            <option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="meal-name">Meal Name</label>
        <input type="text" id="meal-name" placeholder="e.g. Chicken Adobo" required>
      </div>
      <div class="form-group">
        <label for="meal-ingredients">Ingredients (comma separated)</label>
        <input type="text" id="meal-ingredients" placeholder="e.g. chicken, soy sauce, vinegar, garlic">
      </div>
      <div class="form-group">
        <label for="meal-notes">Notes (optional)</label>
        <input type="text" id="meal-notes" placeholder="Optional notes">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancel-meal-modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-meal-btn">Save Meal</button>
      </div>
    </form>
  </div>
</div>

<!-- Grocery Modal -->
<div class="modal-overlay" id="grocery-modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="grocery-modal-title">Add Grocery Item</h3>
      <button class="modal-close" id="close-grocery-modal">&times;</button>
    </div>
    <form id="grocery-form">
      <input type="hidden" id="grocery-id">
      <div class="form-group">
        <label for="grocery-name">Item Name</label>
        <input type="text" id="grocery-name" placeholder="e.g. Chicken Breast" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="grocery-quantity">Quantity</label>
          <input type="text" id="grocery-quantity" placeholder="e.g. 1 kg" required>
        </div>
        <div class="form-group">
          <label for="grocery-category">Category</label>
          <select id="grocery-category" required>
            <option>Vegetables</option><option>Fruits</option><option>Meat</option>
            <option>Dairy</option><option>Grains</option><option>Drinks</option>
            <option>Snacks</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancel-grocery-modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-grocery-btn">Save Item</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="script.js"></script>
</body>
</html>
